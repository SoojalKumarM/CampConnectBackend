# One command: MySQL + API.   docker compose up --build
# Reads values from a local .env file (copy .env.example). API: http://localhost:8080
services:
  db:
    image: mysql:8.4
    container_name: campus-connect-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: campus_connect
    ports: ["3306:3306"]
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: campus-connect-api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      VERIFIED_DOMAINS: ${VERIFIED_DOMAINS:-}
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-log}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-connection_request}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-en}
    volumes: [uploads:/app/uploads]

volumes:
  db-data:
  uploads:
